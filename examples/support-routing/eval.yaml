# Five-minute demo: deterministic mock model with injected provider faults.
name: support-routing
task: classification
description: Route a support ticket to billing / technical / account / shipping.
dataset:
  path: support-tickets.jsonl
  id: support-routing-v3
prompt:
  system: "Classify the support ticket. Answer with one word: billing, technical, account or shipping."
  template: "{input}"
provider:
  kind: mock
  model: mock-v1
  accuracy: 0.86
  infra_error_rate: 0.06
  model_error_rate: 0.02
scorer:
  kind: classification
  labels: [billing, technical, account, shipping]
run:
  seed: 0
  concurrency: 4
  retries: 0
pricing: prices.yaml
