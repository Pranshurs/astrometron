# Choose a model for support-ticket classification from verified evidence only.
task: classification
dataset: support-routing-v3
python_path: ["."]
requirements:
  min_success_rate: 0.85        # judged on the Wilson 95% lower bound by default
  max_p95_ms: 50
  max_cost_per_case_usd: 0.001
  max_error_rate: 0.05
  min_cases: 100
  max_evidence_age_days: 30
objective: cheapest
candidates:
  - {kind: mock, model: mock-v1, accuracy: 0.86, infra_error_rate: 0.06, model_error_rate: 0.02}
  - {kind: mock, model: mock-large, accuracy: 0.97, infra_error_rate: 0.01, model_error_rate: 0.0, latency_ms: 3}
  - {kind: python, function: "support_models:keyword_router", model: keyword-router-v1, pinned: true}
