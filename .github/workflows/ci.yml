# Prepared locally; not yet pushed anywhere. Third-party actions pinned to commit SHAs
# (resolved 2026-10-04 from the actions' tag refs).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests tools bench examples
      - run: ruff format --check src tests tools bench examples
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - {os: macos-latest, python: "3.11"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install -e ".[dev]"
      - name: unit, integration and adversarial tests
        run: pytest
      - name: adversarial integrity suite via the CLI
        run: astrometron selfcheck

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: python tools/mutation_gate.py --json mutation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: mutation-results, path: mutation.json}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: clean-venv install + CLI smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd examples/support-routing
          /tmp/clean/bin/astrometron --store /tmp/store run eval.yaml
          /tmp/clean/bin/astrometron --store /tmp/store reproduce latest
          /tmp/clean/bin/astrometron selfcheck

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip install .
      - run: pip-audit --skip-editable
